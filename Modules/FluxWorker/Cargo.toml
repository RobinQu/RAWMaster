[package]
name = "rawmaster-flux-worker"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "flux-worker"
path = "src/main.rs"

[dependencies]
fs2 = "0.4"
mlx-rs = { version = "0.34.0", default-features = false, features = ["metal", "accelerate", "safetensors"] }
safetensors = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
half = "2"
anyhow = "1"
sha2 = "0.10"
tokenizers = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
