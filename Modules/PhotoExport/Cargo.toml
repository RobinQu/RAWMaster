[package]
name = "rawmaster-photo-export"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
base64 = "0.22"
fast_image_resize = "6.2"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tiff = { version = "0.11", default-features = false }
turbojpeg = { version = "1.5", default-features = false, features = ["cmake"] }
bytemuck = "1"
libc = "0.2"
