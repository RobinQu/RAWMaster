[package]
name = "rawmaster-image"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["gpu", "metal-surface"]
surface-fence-probe = ["metal-surface"]
native-half-probe = ["metal-surface"]
metal-surface = ["gpu", "dep:metal", "dep:foreign-types"]
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
libm = "=0.2.16"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
rayon = "1.11"
wgpu = { version = "=27.0.1", default-features = false, features = ["std", "metal", "vulkan", "wgsl"], optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", optional = true }
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "=0.32.0", optional = true }
foreign-types = { version = "=0.5.0", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
cc = "1"
