[package]
name = "rawmaster-library"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "rawmaster_library"
crate-type = ["cdylib", "rlib"]

[dependencies]
md-5 = "0.10"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
roxmltree = "0.21"
jpeg-decoder = { version = "0.3", default-features = false }
hex = "0.4"
libc = "0.2"
rusqlite = { version = "=0.40.1", features = ["backup", "functions", "collation"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4", "v5"] }
