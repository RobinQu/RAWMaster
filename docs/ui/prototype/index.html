<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>RAWMaster · 摄影工作台</title>
  <link rel="stylesheet" href="workbench.css">
  <link rel="stylesheet" href="editor.css">
  <link rel="stylesheet" href="quick-prompt.css">
  <link rel="stylesheet" href="dag.css">
  <link rel="stylesheet" href="canvas-tools.css">
  <link rel="stylesheet" href="design.css">
  <link rel="stylesheet" href="scene-editor.css">
  <link rel="stylesheet" href="keyboard-focus.css">
</head>
<body>
  <a class="skip" href="#workspace" onclick="document.getElementById('workspace').focus();return false">跳至工作区</a>
  <header id="chrome"></header>
  <main id="workspace" tabindex="-1"></main>
  <section id="delivery" hidden aria-label="照片导出工作台"><iframe id="export-frame" title="导出选片、预览与交付设置"></iframe></section>
  <dialog id="sheet" aria-labelledby="sheet-title"><div id="sheet-content"></div></dialog>
  <dialog id="activity-window" aria-labelledby="activity-title"></dialog>
  <div id="notice" class="toast" role="status" aria-live="polite"></div>
  <script src="photos.js"></script>
  <script src="scene-output.js"></script>
  <script src="model.js"></script>
  <script src="histograms.js"></script>
  <script src="ui.js"></script>
  <script src="delivery.js"></script>
  <script src="library.js"></script>
  <script src="sessions.js"></script>
  <script src="editor-canvas.js"></script>
  <script src="editor.js"></script>
  <script src="quick-prompt.js"></script>
  <script src="tools.js"></script>
  <script src="design.js"></script>
  <script src="dag.js"></script>
  <script src="dag-window.js"></script>
  <script src="canvas-tools.js"></script>
  <script src="scene-editor.js"></script>
  <script src="activity.js"></script>
  <script src="app.js"></script>
</body>
</html>
