name: macOS regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    # The imaging code uses macOS 27 Core Image APIs (despeckle, render
    # estimation); the macos-26 image ships the macOS 26 SDK and cannot
    # compile it. xcode-27 is GitHub's public Xcode 27 image.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record platform
        run: |
          mkdir -p output/validation/ci
          sw_vers > output/validation/ci/platform.txt
          uname -m >> output/validation/ci/platform.txt
          swift --version >> output/validation/ci/platform.txt
          xcodebuild -version >> output/validation/ci/platform.txt
          echo "macOS SDK: $(xcrun --sdk macosx --show-sdk-version)" >> output/validation/ci/platform.txt
          cargo --version >> output/validation/ci/platform.txt
      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Modules/*/Cargo.lock', 'Modules/*/Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-
      - name: Fetch pinned Rust dependencies
        # SwiftPM plugin sandboxes deny network access; this is the only step
        # allowed to download crates for the plugin builds that follow.
        run: scripts/fetch-rust-dependencies.sh
      - name: Prepare pinned annotation DOM tests
        run: npm ci --prefix Tests/ReviewUI --ignore-scripts --no-audit --no-fund
      - name: Validate offline experiment runner
        run: |
          set -o pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s Tests/Tooling -v 2>&1 | tee output/validation/ci/experiment-runner-tests.log
      - name: Run regression tests including all JPEG fixtures
        env:
          RAWMASTER_SEQUENCE_FIXTURE_REPORT: ${{ github.workspace }}/output/validation/ci/fixture-regression.json
        run: |
          set -o pipefail
          export RAWMASTER_SEQUENCE_FIXTURE_SWIFT_VERSION="$(swift --version)"
          CARGO_NET_OFFLINE=true swift test --jobs 3 2>&1 | tee output/validation/ci/tests.log
      - name: Build client
        env:
          CARGO_NET_OFFLINE: 'true'
        run: swift build -c release --product RAWMaster --jobs 3
      - name: Compare accepted annotations with versioned grouping rules
        run: |
          set -o pipefail
          binary_dir="$(swift build --show-bin-path)"
          test_bundle="$binary_dir/RAWMasterImagingTests.xctest"
          if [ ! -d "$test_bundle" ]; then
            test_bundle="$binary_dir/RAWMasterPackageTests.xctest"
          fi
          python3 scripts/sequence-accepted-regression.py \
            --binary "$test_bundle" --repeats 3 \
            --output output/validation/ci/accepted-annotations \
            2>&1 | tee output/validation/ci/accepted-annotations.log
      - name: Measure strict grouping quality (currently unmet)
        id: grouping-quality
        env:
          RAWMASTER_SEQUENCE_FIXTURE_REPORT: ${{ github.workspace }}/output/validation/ci/fixture-quality.json
        run: |
          set -o pipefail
          set +e
          ./scripts/sequence-fixture-quality.sh 2>&1 | tee output/validation/ci/quality.log
          quality_statuses=("${PIPESTATUS[@]}")
          quality_exit=${quality_statuses[0]}
          if [ "${quality_statuses[1]}" -ne 0 ]; then
            echo 'quality_status=log-write-error' >> "$GITHUB_OUTPUT"
            exit 1
          fi
          set -e
          echo "exit_code=$quality_exit" >> "$GITHUB_OUTPUT"
          if [ "$quality_exit" -eq 2 ]; then
            echo 'quality_status=measured-unmet' >> "$GITHUB_OUTPUT"
            echo '::warning::Grouping quality was measured and remains unmet; see fixture-quality.json.'
          elif [ "$quality_exit" -eq 0 ]; then
            echo 'quality_status=accepted' >> "$GITHUB_OUTPUT"
          else
            echo 'quality_status=execution-or-integrity-error' >> "$GITHUB_OUTPUT"
            exit "$quality_exit"
          fi
      - name: Report separate regression and quality outcomes
        if: always()
        env:
          QUALITY_STATUS: ${{ steps.grouping-quality.outputs.quality_status }}
        run: |
          {
            echo '## Sequence grouping'
            echo 'Default tests check approved behavior, fixture integrity and real JPEG processing.'
            echo 'Accepted-annotation regression separately compares versioned rules on the human revision, including DJI JPEG-only inputs; failures block this job.'
            echo "Strict human-label quality outcome: **$QUALITY_STATUS**."
            echo 'A successful regression job does not mean grouping quality is accepted.'
            echo 'The original truth and dual-format frozen controls remain separate from the accepted revision; DJI has no confirmed outside endpoint.'
            echo 'Runner platform is recorded; this is not M4 hardware or RAW decoder acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload reports and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sequence-regression-${{ github.run_id }}
          path: output/validation/ci/
          if-no-files-found: error
