[package]
name = "rmq-probe"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rawmaster-library = { path = "../../../Modules/LibraryCatalog" }
rusqlite = "=0.40.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[features]
# Linux headless runs can supply their own SQLite; macOS uses its system library.
bundled-sqlite = ["rusqlite/bundled"]

[workspace]
