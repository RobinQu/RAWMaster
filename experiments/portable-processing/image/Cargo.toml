[package]
name = "rawmaster-image-poc"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["gpu"]
gpu = ["dep:wgpu", "dep:pollster"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.11"
wgpu = { version = "=27.0.1", default-features = false, features = ["std", "metal", "vulkan", "wgsl"], optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = "1"
sha2 = "0.10"

[build-dependencies]
cc = "1"
